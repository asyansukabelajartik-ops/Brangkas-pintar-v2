<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brankas Pro - Tanpa LED</title>
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --dark: #0f172a; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--dark); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 400px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { text-align: center; font-size: 1.4rem; margin-bottom: 20px; }
        .data-display { display: flex; justify-content: space-between; padding: 12px; background: #f1f5f9; border-radius: 8px; margin: 8px 0; font-weight: bold; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        #alertBanner { background: var(--danger); color: white; text-align: center; padding: 15px; border-radius: 8px; display: none; font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        input[type="range"] { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Kontrol Brankas</h1>
    
    <div id="alertBanner">🚨 PERINGATAN: DIBOBOL! 🚨</div>

    <div class="card">
        <button class="btn-primary" id="btnConnect">🔗 Sambungkan ke Micro:bit</button>
        <div class="data-display">
            <span>Cahaya:</span>
            <span id="valCahaya" style="color: var(--primary);">--</span>
        </div>
        <div class="data-display">
            <span>Status:</span>
            <span id="txtStatus">Standby 🔒</span>
        </div>
    </div>

    <div class="card">
        <label>⚙️ Sensitivitas: <b id="lblAmbang">50</b></label>
        <input type="range" id="sliderAmbang" min="5" max="300" value="50">
        <button class="btn-danger" id="btnAlarmOn">Aktifkan Proteksi</button>
        <button class="btn-success" id="btnAlarmOff" style="display:none">Matikan Alarm</button>
    </div>

    <div class="card" style="font-size: 0.85rem; border-left: 4px solid var(--primary);">
        <b>Verifikasi Pemulihan:</b><br>
        Hitung luas daerah antara kurva:<br>
        $f(x) = 2x^2 - 4x + 1$ dan $g(x) = -x^2 + 2x + 4$
    </div>
</div>

<script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_CHARACTERISTIC = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_CHARACTERISTIC = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let device, characteristicTX;

    async function handleConnect() {
        try {
            device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'BBC micro:bit' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            characteristicTX = await service.getCharacteristic(TX_CHARACTERISTIC);
            const characteristicRX = await service.getCharacteristic(RX_CHARACTERISTIC);

            await characteristicRX.startNotifications();
            characteristicRX.addEventListener('characteristicvaluechanged', (event) => {
                const decoder = new TextDecoder();
                const message = decoder.decode(event.target.value).trim();
                processIncomingData(message);
            });

            document.getElementById('btnConnect').innerText = "✅ Terhubung";
            document.getElementById('btnConnect').disabled = true;
        } catch (error) { console.log(error); }
    }

    function processIncomingData(msg) {
        if (msg.startsWith("CAHAYA:")) {
            document.getElementById('valCahaya').innerText = msg.split(":")[1];
        } else if (msg === "STATUS:DIBOBOL") {
            document.getElementById('alertBanner').style.display = "block";
            document.getElementById('btnAlarmOff').style.display = "block";
            document.getElementById('txtStatus').innerText = "BAHAYA! 🔓";
            document.getElementById('txtStatus').style.color = "var(--danger)";
        } else if (msg === "STATUS:ALARM_MATI") {
            document.getElementById('alertBanner').style.display = "none";
            document.getElementById('btnAlarmOff').style.display = "none";
            document.getElementById('txtStatus').innerText = "Aman 🔒";
            document.getElementById('txtStatus').style.color = "var(--success)";
        } else if (msg === "STATUS:DIBUKA_AMAN") {
            document.getElementById('txtStatus').innerText = "Terbuka Aman 🔓";
            document.getElementById('txtStatus').style.color = "var(--primary)";
        }
    }

    async function sendCommand(cmd) {
        if (characteristicTX) {
            const encoder = new TextEncoder();
            await characteristicTX.writeValue(encoder.encode(cmd + "\n"));
        }
    }

    document.getElementById('btnConnect').onclick = handleConnect;
    document.getElementById('btnAlarmOn').onclick = () => sendCommand("ALARM_ON");
    document.getElementById('btnAlarmOff').onclick = () => sendCommand("ALARM_OFF");
    document.getElementById('sliderAmbang').oninput = (e) => {
        document.getElementById('lblAmbang').innerText = e.target.value;
        sendCommand("SET_LIMIT:" + e.target.value);
    };
</script>
</body>
</html>

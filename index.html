<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Controller Stable</title>

<style>
:root{
--p:#2563eb;
--d:#dc2626;
--s:#16a34a;
--bg:#f1f5f9;
}

body{
font-family:Segoe UI;
background:var(--bg);
display:flex;
justify-content:center;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
width:100%;
max-width:420px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.blue{background:var(--p);color:white;}
.red{background:var(--d);color:white;}
.green{background:var(--s);color:white;}

.status{
display:flex;
justify-content:space-between;
background:#f8fafc;
padding:12px;
border-radius:8px;
margin-top:10px;
font-weight:bold;
}

#debug{
background:#020617;
color:#38bdf8;
font-family:monospace;
font-size:11px;
height:120px;
overflow:auto;
padding:10px;
border-radius:8px;
margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

<h2 style="text-align:center">🛡️ Vault Controller</h2>

<button class="blue" id="btnConnect">HUBUNGKAN BLUETOOTH</button>

<div class="status">
<span>Sensor Cahaya</span>
<span id="valCahaya">--</span>
</div>

<div class="status">
<span>Status</span>
<span id="txtStatus">Standby</span>
</div>

<button class="red" id="btnAlarmOn" disabled>AKTIFKAN PROTEKSI</button>
<button class="green" id="btnAlarmOff" style="display:none;">MATIKAN ALARM</button>

<div id="debug">Menunggu koneksi...</div>

</div>

<script>

const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
const UART_TX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
const UART_RX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"

let device
let txChar
let rxChar

let buffer = ""

function log(t){
const d=document.getElementById("debug")
d.innerHTML+="<br>> "+t
d.scrollTop=d.scrollHeight
console.log(t)
}

async function connect(){

try{

log("Mencari micro:bit...")

device = await navigator.bluetooth.requestDevice({
filters:[{namePrefix:"BBC micro:bit"}],
optionalServices:[UART_SERVICE]
})

log("Menghubungkan GATT...")

const server = await device.gatt.connect()

log("Mengambil UART Service")

const service = await server.getPrimaryService(UART_SERVICE)

txChar = await service.getCharacteristic(UART_TX)
rxChar = await service.getCharacteristic(UART_RX)

await rxChar.startNotifications()

rxChar.addEventListener("characteristicvaluechanged",handleRX)

device.addEventListener("gattserverdisconnected",disconnected)

document.getElementById("btnConnect").innerText="TERHUBUNG"
document.getElementById("btnConnect").disabled=true
document.getElementById("btnAlarmOn").disabled=false

log("Sistem siap")

}catch(e){

log("ERROR "+e)

}

}

function handleRX(event){

let chunk = new TextDecoder().decode(event.target.value)

buffer += chunk

let lines = buffer.split("\n")

buffer = lines.pop()

lines.forEach(line=>{
line=line.trim()
if(line!=""){
handleMessage(line)
}
})

}

function handleMessage(msg){

log("RX "+msg)

if(msg.startsWith("CAHAYA:")){

let v=msg.split(":")[1]
document.getElementById("valCahaya").innerText=v

}

else if(msg.includes("DIBOBOL")){

document.getElementById("txtStatus").innerText="DIBOBOL 🚨"
document.getElementById("txtStatus").style.color="red"
document.getElementById("btnAlarmOff").style.display="block"

}

else if(msg.includes("ALARM_MATI")){

document.getElementById("txtStatus").innerText="Aman"
document.getElementById("txtStatus").style.color="green"
document.getElementById("btnAlarmOff").style.display="none"

}

else if(msg.includes("DIBUKA_AMAN")){

document.getElementById("txtStatus").innerText="Terbuka Aman"
document.getElementById("txtStatus").style.color="blue"

}

}

async function send(text){

if(!txChar){

log("Bluetooth belum terhubung")

return

}

try{

let data = new TextEncoder().encode(text+"\n")

await txChar.writeValue(data)

log("TX "+text)

}catch(e){

log("Gagal kirim "+e)

}

}

function disconnected(){

log("Bluetooth terputus")

document.getElementById("btnConnect").disabled=false
document.getElementById("btnConnect").innerText="HUBUNGKAN BLUETOOTH"

}

document.getElementById("btnConnect").onclick=connect

document.getElementById("btnAlarmOn").onclick=()=>send("ALARM_ON")

document.getElementById("btnAlarmOff").onclick=()=>send("ALARM_OFF")

</script>

</body>
</html>
